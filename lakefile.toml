name = "PrincipalBundles"
defaultTargets = ["PrincipalBundles"]

# Pinned to the Mathlib commit used by the vendored Tau Ceti files (TauCeti/VENDORED.md),
# so those files build unchanged. Bump this, the manifest and lean-toolchain together.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "1b1ccf4b088b32fa3f23f2de1127433254a81e1e"

# Files copied from Tau Ceti; see TauCeti/VENDORED.md.
[[lean_lib]]
name = "TauCeti"
globs = ["TauCeti.+"]

[[lean_lib]]
name = "PrincipalBundles"
